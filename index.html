:root{--pink:#ff59ad;--purple:#8457e8;--ink:#4e3c77}*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 12%,#fff6a8 0 5%,transparent 18%),radial-gradient(circle at 90% 20%,#ffd3eb 0 8%,transparent 24%),linear-gradient(135deg,#c6f8ff,#fff2fb 55%,#e4dcff);min-height:100dvh;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column;gap:9px;padding:calc(env(safe-area-inset-top) + 9px) max(10px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 8px) max(10px,env(safe-area-inset-left));max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:53px}.brand{font-size:clamp(18px,3.5vw,30px);font-weight:1000;color:#f43191;text-shadow:2px 2px #fff;letter-spacing:-.5px;white-space:nowrap}.topActions{display:flex;gap:7px}.btn{border:0;cursor:pointer;border-radius:16px;padding:10px 13px;font:800 14px inherit;font-weight:850;color:#61468b;background:#fff;box-shadow:0 4px 0 #dacbe8;touch-action:manipulation;white-space:nowrap}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #dacbe8}.btn.primary{background:linear-gradient(120deg,#ff64b6,#fa87cb);color:white;box-shadow:0 4px 0 #df4791}.btn.active{outline:3px solid #f7c044}.main{flex:1;min-height:0;display:flex;gap:12px;justify-content:center;align-items:stretch}.sheetShell{position:relative;min-width:0;max-width:100%;aspect-ratio:210/297;height:100%;background:white;border-radius:12px;overflow:hidden;box-shadow:0 9px 30px #79569a3c;border:5px solid #fff}.sheetShell img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}.sheetShell canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.sheetShell.cover canvas{pointer-events:none}.toolbar{width:235px;min-width:235px;background:#ffffffeb;border:2px solid white;border-radius:23px;padding:14px;box-shadow:0 8px 25px #79569a22;overflow:auto;display:flex;flex-direction:column;gap:11px}.toolbar.hidden{display:none}.sectionTitle{font-size:13px;font-weight:900;color:#8063a8}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.swatch{width:100%;aspect-ratio:1;border:3px solid white;border-radius:50%;box-shadow:0 2px 5px #4e3c7740;cursor:pointer}.swatch.selected{outline:3px solid #7045d8;transform:scale(1.05)}.brushes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.brush{border:2px solid #e7dafa;border-radius:13px;background:#faf5ff;padding:9px 2px;color:#6a4a99;font-weight:800;cursor:pointer}.brush.selected{border-color:#a06bff;background:#efe1ff}.range{width:100%;accent-color:#f552a9}.toolsRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolsRow .btn{padding:10px 3px;font-size:12px}.bottom{background:#ffffffd9;border-radius:20px;padding:8px 10px;box-shadow:0 5px 18px #79569a22;display:flex;align-items:center;gap:9px;min-height:75px}.arrow{flex:none;border:0;border-radius:13px;background:#f4ddff;color:#7c4ad8;font-size:25px;font-weight:900;width:39px;height:48px;cursor:pointer}.pages{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;flex:1;align-items:center;padding:4px}.page{flex:none;position:relative;border:3px solid transparent;border-radius:11px;padding:0;background:#fff;overflow:hidden;cursor:pointer;height:53px;width:41px;box-shadow:0 2px 5px #bda4cc88}.page img{height:100%;width:100%;object-fit:cover}.page.selected{border-color:#fc4fa5;transform:translateY(-2px)}.page span{position:absolute;bottom:0;right:0;background:#ff61ad;color:white;font-weight:900;font-size:10px;padding:1px 4px;border-radius:5px 0 0 0}.status{font-size:12px;font-weight:800;text-align:center;white-space:nowrap}.hint{font-size:11px;color:#987db0;text-align:center}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#7049ae;color:white;border-radius:16px;padding:10px 16px;font-weight:800;pointer-events:none;opacity:0;transition:opacit </style></head><body><div class="app"><header class="top"><div class="brand">🌈 Раскраска Виктории ✨</div><div class="topActions"><button class="btn" id="music" aria-label="Включить музыку">♫ Музыка</button><button class="btn primary" id="toggle">🎨 Кисти</button></div></header><div class="main"><div class="sheetShell cover" id="sheet"><img id="art" alt="Страница раскраски" src="assets/page-01.jpg"><canvas id="paint"></canvas></div><aside class="toolbar hidden" id="toolbar"><div class="sectionTitle">🌈 Выбери цвет</div><div class="palette" id="palette"></div><div class="sectionTitle">🖌️ Волшебные кисточки</div><div class="brushes" id="brushes"><button class="brush selected" data-brush="pencil">✏️ Карандаш</button><button class="brush" data-brush="marker">🖍️ Фломастер</button><button class="brush" data-brush="soft">☁️ Акварель</button><button class="brush" data-brush="sparkle">✨ Блёстки</button></div><div class="sectionTitle">Толщина кисти: <span id="sizeText">8</span></div><input class="range" id="size" type="range" min="2" max="45" value="8"><div class="toolsRow"><button class="btn" id="eraser">🧽 Ластик</button><button class="btn" id="undo">↶ Отменить</button><button class="btn" id="redo">↷ Вернуть</button><button class="btn" id="clear">🗑️ Очистить</button></div><button class="btn primary" id="save">💾 Сохранить рисунок</button><div class="hint">Рисуй пальцем или Apple Pencil 💕</div></aside></div><nav class="bottom"><button class="arrow" id="prev" aria-label="Предыдущая страница">‹</button><div class="pages" id="pages"></div><button class="arrow" id="next" aria-label="Следующая страница">›</button><div class="status" id="status">1 / 12</div></nav></div><div class="toast" id="toast"></div><script>
const TOTAL=12, W=840,H=1188;let page=0,color='#ff4b91',brush='pencil',size=8,erasing=false,drawing=false,current=null;const history=Array.from({length:TOTAL},()=>[]),redoHistory=Array.from({length:TOTAL},()=>[]);const $=id=>document.getElementById(id),canvas=$('paint'),ctx=canvas.getContext('2d'),sheet=$('sheet'),art=$('art');canvas.width=W;canvas.height=H;const colors=['#171717','#ffffff','#8a8a8a','#78452d','#ff334e','#ff8a23','#ffe334','#70d32b','#12ad65','#14c8c9','#2085ff','#233fe5','#8434d6','#e954c4','#ffb5d7','#b7e8ff'];function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
colors.forEach(c=>{let b=document.createElement('button');b.className='swatch'+(c===color?' selected':'');b.style.background=c;b.title=c;b.setAttribute('aria-label','Цвет '+c);b.onclick=()=>{color=c;erasing=false;$('eraser').classList.remove('active');document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('palette').append(b)});document.querySelectorAll('.brush').forEach(b=>b.onclick=()=>{brush=b.dataset.brush;erasing=false;$('eraser').classList.remove('active');document.querySelectorAll('.brush').forEach(x=>x.classList.toggle('selected',x===b))});$('size').oninput=e=>{$('sizeText').textContent=size=+e.target.value};$('eraser').onclick=()=>{erasing=!erasing;$('eraser').classList.toggle('active',erasing)};
function drawStroke(s){if(!s.points.length)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.globalCompositeOperation=s.eraser?'destination-out':'source-over';ctx.strokeStyle=s.eraser?'#000':s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.size;ctx.globalAlpha=s.brush==='soft'&&!s.eraser?.22:s.brush==='marker'&&!s.eraser?.75:1;let pts=s.points;if(s.brush==='sparkle'&&!s.eraser){ctx.globalAlpha=.95;pts.forEach((p,i)=>{const r=s.size*.5;ctx.beginPath();for(let k=0;k<10;k++){let a=k*Math.PI/5-Math.PI/2,rad=k%2?r*.35:r;let x=p.x+Math.cos(a)*rad,y=p.y+Math.sin(a)*rad;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill()});ctx.restore();return}ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);if(pts.length===1){ctx.lineTo(pts[0].x+.01,pts[0].y+.01)}else for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();if(s.brush==='soft'&&!s.eraser){ctx.lineWidth=s.size*1.8;ctx.globalAlpha=.08;ctx.stroke()}ctx.restore()}
function redraw(){ctx.clearRect(0,0,W,H);history[page].forEach(drawStroke);if(current)drawStroke(current)}function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}canvas.addEventListener('pointerdown',e=>{if(page===0)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;current={color,brush,size,eraser:erasing,points:[pos(e)]};redraw()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();current.points.push(pos(e));redraw()});function finish(){if(!drawing)return;drawing=false;history[page].push(current);current=null;redoHistory[page]=[];redraw()}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);$('undo').onclick=()=>{if(history[page].length){redoHistory[page].push(history[page].pop());redraw()}else toast('Пока нечего отменять')};$('redo').onclick=()=>{if(redoHistory[page].length){history[page].push(redoHistory[page].pop());redraw()}};$('clear').onclick=()=>{if(!history[page].length)return;if(confirm('Стереть весь рисунок на этой странице?')){history[page]=[];redoHistory[page]=[];redraw()}};
function changePage(n){page=Math.max(0,Math.min(TOTAL-1,n));art.src=`assets/page-${String(page+1).padStart(2,'0')}.jpg`;sheet.classList.toggle('cover',page===0);$('status').textContent=`${page+1} / ${TOTAL}`;document.querySelectorAll('.page').forEach((b,i)=>b.classList.toggle('selected',i===page));document.querySelectorAll('.page')[page].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});current=null;drawing=false;redraw();if(page===0)toast('✨ Волшебная обложка!')}for(let i=0;i<TOTAL;i++){const b=document.createElement('button');b.className='page'+(i===0?' selected':'');b.setAttribute('aria-label','Страница '+(i+1));b.innerHTML=`<img src="assets/page-${String(i+1).padStart(2,'0')}.jpg" alt=""><span>${i+1}</span>`;b.onclick=()=>changePage(i);$('pages').append(b)}$('prev').onclick=()=>changePage(page-1);$('next').onclick=()=>changePage(page+1);$('toggle').onclick=()=>{const hidden=$('toolbar').classList.toggle('hidden');$('toggle').textContent=hidden?'🎨 Кисти':'✕ Скрыть'};
$('save').onclick=async()=>{const out=document.createElement('canvas');out.width=W*2;out.height=H*2;const c=out.getContext('2d');const im=new Image();im.onload=()=>{c.drawImage(im,0,0,out.width,out.height);c.drawImage(canvas,0,0,out.width,out.height);out.toBlob(async blob=>{const file=new File([blob],`Раскраска_Виктории_${page+1}.png`,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Моя раскраска'});return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Картинка сохранена!')},'image/png')};im.src=art.src};
// Original gentle melody synthesized in Web Audio; audio starts only on user gesture.
let audio=null,musicOn=false,musicTimer=null,noteIndex=0;const melody=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,659.25,587.33,523.25,392,440,523.25,587.33,523.25];function playNote(freq){if(!audio)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+.36);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.4)}$('music').onclick=async()=>{if(!musicOn){try{audio??=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();musicOn=true;noteIndex=0;playNote(melody[noteIndex++]);musicTimer=setInterval(()=>playNote(melody[(noteIndex++)%melody.length]),420);$('music').textContent='🔊 Музыка';$('music').classList.add('active')}catch(e){toast('Звук недоступен')}}else{musicOn=false;clearInterval(musicTimer);$('music').textContent='♫ Музыка';$('music').classList.remove('active')}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&musicOn){clearInterval(musicTimer);musicOn=false;$('music').textContent='♫ Музыка';$('music').classList.remove('active')}});changePage(0);
</script></body></html>
